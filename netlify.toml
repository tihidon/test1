# Netlify deploy: only whitelisted public files are copied to dist/ and published.
# Anything not listed here (docs/, AGENTS.md, tools/, test/, .git) never leaves the repo.
# To publish a new file, add it to the cp list below and verify on the deploy preview.
[build]
  command = "rm -rf dist && mkdir -p dist && cp index.html sw.js manifest.webmanifest _headers privacy.html delete-account.html dist/ && cp -r img dist/"
  publish = "dist"
