name: Snail City engineering gates
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated reference CLI and AST dependencies
        run: |
          python -m venv "$RUNNER_TEMP/sc-cli"
          "$RUNNER_TEMP/sc-cli/bin/python" -m pip install 'git+https://github.com/agentskills/agentskills.git@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref'
          "$RUNNER_TEMP/sc-cli/bin/python" -m pip install tinycss2==1.5.1
          echo "$RUNNER_TEMP/sc-cli/bin" >> "$GITHUB_PATH"
          npm install --prefix "$RUNNER_TEMP/sc-ast" --ignore-scripts --no-audit --no-fund acorn@8.19.0 acorn-walk@8.3.5 eslint@10.15.0
          echo "NODE_PATH=$RUNNER_TEMP/sc-ast/node_modules" >> "$GITHUB_ENV"
      - name: Official skill validation
        run: |
          skills-ref validate .agents/skills/snail-city-engineering
          skills-ref validate .agents/skills/chromium-runtime-qa
          skills-ref validate .agents/skills/agent-reliability
          skills-ref validate .agents/skills/snail-city-stress-test-specialist
          skills-ref validate .agents/skills/snail-city-architecture-infrastructure
          skills-ref read-properties .agents/skills/snail-city-engineering
          skills-ref to-prompt .agents/skills/snail-city-engineering .agents/skills/chromium-runtime-qa .agents/skills/agent-reliability .agents/skills/snail-city-stress-test-specialist .agents/skills/snail-city-architecture-infrastructure
      - name: Tool regression fixtures
        run: |
          python -m unittest discover -s tools/agent -p 'test_*.py' -v
          node --test tools/agent/test_audit_loops.cjs tools/agent/test_debug_tools.cjs
      - name: Reliability checker regression fixtures
        run: python -m unittest discover -s tools/reliability -p 'test_*.py' -v
      - name: SC-CODE-01 quality fixtures
        run: python -m unittest discover -s tools/sc-code-01 -p 'test_*.py' -v
      - name: SC-CODE-01 canonical ratchet and locations
        env:
          SC_BASE: ${{ github.event.pull_request.base.sha || 'eddfa33acf5f875f2dbdf746ebf436651e61f80b' }}
        run: python tools/sc-code-01/quality_gate.py --base "$SC_BASE" --out "$RUNNER_TEMP/sc-quality.json"
      - name: Preserve quality report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sc-quality-inventory
          path: ${{ runner.temp }}/sc-quality.json
          if-no-files-found: warn
          retention-days: 14
      - name: SC-DEBUG-01 ESLint bug ratchet
        env:
          SC_BASE: ${{ github.event.pull_request.base.sha || 'cd79662b45b2477d2d53aba000e60f90fefc8662' }}
        run: |
          node tools/agent/eslint_ratchet.cjs "$SC_BASE" "$RUNNER_TEMP/sc-eslint.json"
          if [ "$SC_BASE" != "cd79662b45b2477d2d53aba000e60f90fefc8662" ]; then
            node tools/agent/eslint_ratchet.cjs cd79662b45b2477d2d53aba000e60f90fefc8662 "$RUNNER_TEMP/sc-eslint-frozen.json"
          fi
      - name: AST duplicate candidate inventory
        if: always()
        run: node tools/agent/audit_duplicates.cjs "$RUNNER_TEMP/sc-duplicates.json"
      - name: Preserve debug static evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sc-debug-static
          path: |
            ${{ runner.temp }}/sc-eslint*.json
            ${{ runner.temp }}/sc-duplicates.json
          if-no-files-found: error
          retention-days: 14
      - name: Historical P3 isolated round-trip
        run: python tools/test_roundtrip.py
      - name: Current build and published bytes
        run: python tools/agent/check_build.py --require-publish-match
      - name: AST loop review inventory
        if: always()
        run: |
          node tools/agent/audit_loops.cjs > "$RUNNER_TEMP/sc-loops.json"
          node -e 'const r=require(process.env.RUNNER_TEMP+"/sc-loops.json"); console.log("parsed files",r.parsedFiles); for(const f of r.reports) console.log(f.file, f.counts, "constant-loop candidates", f.loops.length, "name-cycle candidates",f.cycles.length,"scheduler/lifecycle sites",f.sites.length);'

      - name: Preserve AST inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sc-ast-inventory
          path: ${{ runner.temp }}/sc-loops.json
          if-no-files-found: error
          retention-days: 14
  chromium-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.12'
      - name: Isolated browser tools
        id: browser_setup
        run: |
          mkdir -p "$RUNNER_TEMP/sc-runtime-setup"
          exec > >(tee "$RUNNER_TEMP/sc-runtime-setup/setup.log") 2>&1
          cat /etc/os-release
          python -m venv "$RUNNER_TEMP/sc-qa-venv"
          "$RUNNER_TEMP/sc-qa-venv/bin/python" -m pip install -r tools/qa/requirements.txt
          "$RUNNER_TEMP/sc-qa-venv/bin/python" -m pip freeze
          "$RUNNER_TEMP/sc-qa-venv/bin/python" -m playwright install --with-deps chromium
          echo "$RUNNER_TEMP/sc-qa-venv/bin" >> "$GITHUB_PATH"
      - name: Watchdog and oracle regression fixtures
        run: python -m unittest discover -s tools/qa -p 'test_*.py' -v
      - name: Chromium online/offline shell smoke
        run: python tools/qa/runtime_watchdog.py --out "$RUNNER_TEMP/sc-runtime-evidence"
      - name: Separate Chromium diagnostic coverage run
        run: python tools/qa/runtime_watchdog.py --diagnostic --out "$RUNNER_TEMP/sc-diagnostic-evidence"
      - name: SC-DEBUG-01 phase B real functional scenarios
        run: python tools/qa/runtime_watchdog.py --functional --timeout 300 --out "$RUNNER_TEMP/sc-functional-evidence"
      - name: Report functional scenario outcome (including failures)
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"sc-functional-evidence"/"report.json"
          if not p.is_file():
              print("Functional report absent: BLOCKED_OR_NOT_RUN")
          else:
              r=json.loads(p.read_text(encoding="utf-8"))
              cases=r.get("functional_cases",{})
              summary={"status":r.get("status"),"commit":r.get("commit"),"last_stage":(r.get("steps") or [None])[-1],
                  "reason":r.get("reason"),"cases":{k:{x:v.get(x) for x in ("status","assertions","reason")} for k,v in cases.items()}}
              print(json.dumps(summary,ensure_ascii=True,indent=2))
          PY
      - name: Record missing runtime evidence
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.browser_setup.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/sc-runtime-setup"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"]); (p/"sc-runtime-setup"/"setup-status.json").write_text(json.dumps({"setup_outcome":os.environ.get("SETUP_OUTCOME","unknown"),"runtime_report_present":(p/"sc-runtime-evidence"/"report.json").is_file(),"runtime_status_if_missing":"BLOCKED_OR_NOT_RUN"},indent=2))'
      - name: Preserve private runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sc-chromium-runtime-evidence
          path: |
            ${{ runner.temp }}/sc-runtime-setup/
            ${{ runner.temp }}/sc-runtime-evidence/
            ${{ runner.temp }}/sc-diagnostic-evidence/
            ${{ runner.temp }}/sc-functional-evidence/
          if-no-files-found: error
          retention-days: 14
